name: Mantener Supabase activo

# Supabase Free pausa el proyecto si no ve suficiente actividad en 7 días.
# Dos vueltas de rosca ya dadas acá:
#  - 25/09: el aviso llegó con un ping de solo LECTURA corriendo bien.
#    Una lectura con la anon key no alcanza; hace falta una escritura.
#  - 22/10: el aviso volvió a llegar con la escritura corriendo bien
#    cada 2-3 días (lun/mié/vie). La doc oficial de Supabase dice que
#    hace falta actividad "cada día" de la semana, no cada 2-3 días:
#    https://supabase.com/docs/guides/platform/free-project-pausing
#    -> se pasa a corrida diaria.

on:
  schedule:
    - cron: '0 12 * * *' # todos los días, 12:00 UTC (~9am Argentina)
  workflow_dispatch: {} # botón "Run workflow" para probarlo a mano

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3 # si GitHub no asigna runner rápido, cortar en vez de colgarse 15+ min
    steps:
      - name: Lectura (diagnóstico, no alcanza sola)
        run: |
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/hogares?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "HTTP $code"
          cat /tmp/resp.json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Escritura real (esto es lo que cuenta como actividad)
        run: |
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          code=$(curl -sS -o /tmp/resp2.json -w "%{http_code}" -X PATCH \
            "${SUPABASE_URL}/rest/v1/_keepalive?id=eq.1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"pinged_at\":\"${now}\"}")
          echo "HTTP $code"
          cat /tmp/resp2.json 2>/dev/null || true
          if [ "$code" -ge 400 ]; then
            echo "::error::Falló la escritura ($code). ¿Se corrió supabase/04-keepalive.sql en Supabase?"
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
