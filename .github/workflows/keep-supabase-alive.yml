name: Mantener Supabase activo

# Supabase Free pausa el proyecto después de ~7 días sin actividad en la API.
# Esto hace una consulta mínima cada pocos días para que nunca llegue a eso.

on:
  schedule:
    - cron: '0 12 * * 1,3,5' # lunes, miércoles y viernes 12:00 UTC (~9am Argentina)
  workflow_dispatch: {} # botón "Run workflow" para probarlo a mano

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3 # si GitHub no asigna runner rápido, cortar en vez de colgarse 15+ min
    steps:
      - name: Ping a Supabase
        run: |
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/hogares?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "HTTP $code"
          cat /tmp/resp.json
          if [ "$code" -ge 400 ]; then
            echo "::error::Supabase respondió $code, revisar."
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
